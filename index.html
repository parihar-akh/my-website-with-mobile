<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akash Portfolio</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }
    .card{
      width:350px;
      background:#111827;
      padding:35px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 25px rgba(0,0,0,0.5);
      transition:0.3s;
    }
    .card:hover{
      transform:translateY(-5px);
    }
    .profile-img{
      width:140px;
      height:140px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #38bdf8;
      margin-bottom:20px;
      box-shadow:0 0 20px #38bdf8;
    }
    h1{
      font-size:28px;
      margin-bottom:10px;
      color:#38bdf8;
    }
    .role{
      color:#cbd5e1;
      margin-bottom:20px;
      font-size:18px;
    }
    .about{
      font-size:14px;
      line-height:24px;
      color:#94a3b8;
      margin-bottom:25px;
    }
    .btn{
      display:inline-block;
      padding:12px 25px;
      background:#38bdf8;
      color:black;
      text-decoration:none;
      border-radius:10px;
      font-weight:bold;
      transition:0.3s;
    }
    .btn:hover{
      background:white;
      transform:scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="akash.jpg" alt="Akash" class="profile-img">
    <h1>Akash Singh Parihar</h1>
    <p class="role">welcome </p>
    <a href="#" class="btn" onclick="showMessage()">
      enter
    </a>
  </div>
  <script>
    function showMessage(){
      alert("Welcome to Akash Portfolio ");
    }
  </script>

</body>
</html>
